services:
  - type: web
    name: mnrdc-backend
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/langues/
    disk:
      name: mnrdc-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: PYTHON_VERSION
        value: 3.13.4
